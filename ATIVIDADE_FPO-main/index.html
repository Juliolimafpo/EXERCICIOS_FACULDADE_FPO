<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATIVIDADE</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="container">
      <form id="ContainerForm" class="FormContainer">
        <h1>Crie sua Conta</h1>
        <p>Preencha os dados abaixo para se cadastrar no sistema.</p>
        <div class="grp-Inputs">
          <label for="name">Nome:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            class="MudarCor"
          />
          <label for="emaill">E-maill:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@gmail.com"
            class="MudarCor"
          />
          <label for="password">Senha:</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Minimo 6 caracteres"
            class="MudarCor"
          />
        </div>

        <button class="Btn-Cadastrar" type="submit">Cadastrar</button>

        <div id="mensagem"></div>
      </form>
    </main>
    <script src="./script.js?v=2"></script>
  </body>
</html>
